<div class="rewards-page">
  <header class="top-bar">
    <button routerLink="/menu">← Volver</button>

    <h1>¡Mis Recompensas! 🏆</h1>

    <span>⭐ {{ xp ?? '—' }} XP</span>
  </header>

  <p *ngIf="loading" role="status">
    Cargando recompensas...
  </p>

  <div *ngIf="errorMessage" role="alert">
    {{ errorMessage }}

    <button (click)="load()">Reintentar</button>
  </div>

  <section
    class="rewards-grid"
    *ngIf="!loading && !errorMessage"
  >
    <div
      class="reward-card"
      *ngFor="let trophy of trophies"
      [class.unlocked]="trophy.unlocked"
      [class.locked]="!trophy.unlocked"
    >
      <div class="lock" *ngIf="!trophy.unlocked">
        🔒
      </div>

      <div class="medal">
        {{ trophy.icon }}
      </div>

      <h3>{{ trophy.title }}</h3>

      <p>
        {{
          trophy.unlocked
            ? 'Desbloqueado'
            : 'Completa los primeros ' + trophy.level + ' niveles'
        }}
      </p>
    </div>
  </section>
</div>
