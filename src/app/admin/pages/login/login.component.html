<div class="login-page">

  <div class="loading-overlay" *ngIf="loading">
    <div class="loader-card">
      <div class="spinner"></div>
      <h3>Iniciando sesión...</h3>
    </div>
  </div>

  <div class="bubble bubble-one"></div>
  <div class="bubble bubble-two"></div>
  <div class="bubble bubble-three"></div>

  <div class="login-container">

    <div class="logo-box">
<img src="assets/images/logoo.png" alt="Logo ObesiApp">
    </div>

    <h2>Iniciar Sesión</h2>
    <p class="login-subtitle">Continúa tu aventura saludable</p>

    <div *ngIf="errorMsg" class="login-error">
      {{ errorMsg }}
    </div>

    <input
      [(ngModel)]="username"
      placeholder="Usuario"
      class="login-input"
    />

    <div class="password-container">

  <input
    [(ngModel)]="password"
    [type]="showPassword ? 'text' : 'password'"
    placeholder="Contraseña"
    class="login-input password-input"
  />

  <button
    type="button"
    class="toggle-password"
    (click)="togglePassword()"
  >
    <span class="material-icons">
      {{ showPassword ? 'visibility_off' : 'visibility' }}
    </span>
  </button>

</div>

    <button
      (click)="login()"
      [disabled]="loading"
      class="login-button"
    >
      {{ loading ? 'Entrando...' : 'Entrar' }}
    </button>

    <p class="login-register">
      ¿No tienes cuenta?
      <a (click)="goRegister()">Regístrate aquí</a>
    </p>

  </div>

  <button class="register-home" (click)="goHome()">
    ← Volver al inicio
  </button>

</div>
